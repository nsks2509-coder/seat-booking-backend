# Free portfolio preview; Render free Postgres expires after 30 days.
services:
  - type: web
    name: seat-booking-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-booking-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: seat-booking-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: seat-booking-cache
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: portfolio-admin
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: keyvalue
    name: seat-booking-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: seat-booking-db
    region: singapore
    plan: free
    databaseName: seatbooking
    user: seatbooking
    ipAllowList: []
